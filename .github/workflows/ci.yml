name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (core without shaping, as the browser builds it)
        run: cargo clippy -p gpx-motion-core --no-default-features --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Test (core without shaping)
        run: cargo test -p gpx-motion-core --no-default-features
      - name: Doc links
        env:
          RUSTDOCFLAGS: -D rustdoc::broken_intra_doc_links -D rustdoc::private_intra_doc_links
        run: cargo doc -p gpx-motion-core -p gpx-motion-cli --no-deps

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: '1.88'
    steps:
      - uses: actions/checkout@v4
      - name: Install 1.88
        run: rustup toolchain install 1.88 --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check --workspace --all-targets --locked

  web:
    name: wasm + web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.13.1
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true
      - name: Build wasm
        run: vp run build:wasm
      - name: Check
        run: vp check
      - name: Test
        run: vp test
      - name: Build
        run: vp build
