name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: gpx-motion-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: gpx-motion-macos-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            name: gpx-motion-macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: gpx-motion-windows-x86_64.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build CLI
        run: cargo build --release -p gpx-motion-cli --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cp "target/${{ matrix.target }}/release/gpx-motion" "${{ matrix.name }}"
          chmod +x "${{ matrix.name }}"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: copy "target\${{ matrix.target }}\release\gpx-motion.exe" "${{ matrix.name }}"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.name }}
          fail_on_unmatched_files: true
