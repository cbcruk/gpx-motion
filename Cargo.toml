[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/wasm"]
# The wasm crate only targets wasm32, so keep it out of native build/test runs.
default-members = ["crates/core", "crates/cli"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
gpx-motion-core = { path = "crates/core" }
quick-xml = "0.37"
tiny-skia = "0.11"
ab_glyph = "0.2"
clap = { version = "4", features = ["derive"] }
wasm-bindgen = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rayon = "1"
serde_json = "1"
